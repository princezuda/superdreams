<style>
  :root { --accent: #ff6fa8; --ink: #3a2a1a; --cream: #fffaf0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  /* kit menu, re-skinned for the garden */
  html body #menu { background: radial-gradient(ellipse at 50% 40%, rgba(255, 250, 235, .25), rgba(60, 90, 60, .45)); backdrop-filter: blur(2px); }

  #hud.show { opacity: 1; transform: none; }
  #hud .sd-btn { pointer-events: auto; position: absolute; left: 12px; top: 12px; }
  .hud-card { margin: 10px auto 0; width: min(560px, calc(100vw - 128px)); display: flex; align-items: stretch; gap: 6px; background: rgba(255, 251, 240, .93); border: 3px solid #fff; border-radius: 18px; box-shadow: 0 8px 24px rgba(40, 60, 30, .25); padding: 6px 8px; box-sizing: border-box; color: var(--ink); font-family: Inter, system-ui, sans-serif; }

  .hud-score { margin: 6px auto 0; width: min(460px, calc(100vw - 128px)); display: flex; align-items: center; gap: 8px; font-family: Inter, system-ui, sans-serif; }

  .bar { position: relative; flex: 1; height: 12px; border-radius: 8px; background: rgba(255, 255, 255, .55); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }

  #coach { border-left: 6px solid var(--accent) !important; position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 22; width: min(420px, calc(100vw - 32px)); box-sizing: border-box; background: rgba(255, 251, 240, .96); color: var(--ink); border: 3px solid #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(40, 60, 30, .3); display: flex; gap: 10px; align-items: center; font: 600 15px/1.35 Inter, system-ui, sans-serif; transition: opacity .3s, transform .3s; }

  #mapbar { position: fixed; top: 12px; left: 12px; right: 68px; z-index: 20; display: none; align-items: center; gap: 10px; font-family: Inter, system-ui, sans-serif; }

  #zenEnd.show { display: block; }

  html body .sd-card { padding: 22px 20px; }
  .gg-card h2 { margin: 2px 0 10px; font-size: 30px; font-weight: 900; color: #3a6a2a; }

  .gg-card .sub { color: #6a5a46; margin: 6px 0 12px; }
