<style>
:root{--acc:#ffd27a;--glass:rgba(14,14,34,.74);--line:rgba(200,180,255,.2);--txt:#f2eeff;--dim:#b4acd2;--good:#7dffa8;--bad:#ff6a7a;--gold:#ffd27a}
html,body{margin:0;height:100%;overflow:hidden;background:#07060f;color:var(--txt);-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
svg{display:block;width:100%;height:100%}
.hidden{display:none!important}
#boot{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#2a2050,#07060f 70%);font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#ffd27a;transition:opacity .5s}
#boot .in{text-align:center;width:min(340px,80vw)}
#boot .bar{height:5px;margin-top:14px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#boot .bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#ffb84a,#ff7ad9);transition:width .3s}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
/* ---------- HUD */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
#stats{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;gap:4px;padding:5px 6px}
.st{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 6px;border-radius:10px;font:700 17px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.st i{width:22px;height:22px;display:block}
.st small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-right:2px}
.st.bump{animation:bump .4s ease-out}.st.hurt{animation:hurt .5s ease-out}
@keyframes bump{0%{transform:scale(1.18);background:rgba(255,210,122,.3)}100%{transform:none}}
@keyframes hurt{0%{transform:scale(1.25);background:rgba(255,80,100,.45)}100%{transform:none}}
#waveBox{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;width:250px;box-sizing:border-box}
#waveBox .lab{font:600 10px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:flex;align-items:center;gap:3px;padding:2px 6px 2px 2px;border-radius:20px;background:rgba(255,255,255,.07);font:700 12px/1 system-ui;font-variant-numeric:tabular-nums}
.chip i{width:22px;height:22px;display:block}
.tag{font:700 9px/1 system-ui;letter-spacing:.08em;padding:3px 5px;border-radius:5px;background:rgba(255,120,120,.18);color:#ffc0c8}
.tag.air{background:rgba(140,220,255,.18);color:#bfeaff}.tag.stealth{background:rgba(120,255,240,.15);color:#b0fff0}.tag.armor{background:rgba(200,200,220,.18);color:#e8e8f4}.tag.boss{background:rgba(255,120,60,.3);color:#ffd0b0}.tag.mres{background:rgba(120,255,170,.15);color:#c0ffd8}
.bigbtn{position:relative;font:800 15px/1 system-ui;padding:12px 12px;border-radius:12px;border:0;cursor:pointer;background:linear-gradient(135deg,#7a4cff,#d04dff);color:#fff;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;transition:transform .1s,filter .2s}
.bigbtn:active{transform:scale(.97)}
.bigbtn:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.bigbtn .bonus{font-size:12px;color:#fff3c0;background:rgba(0,0,0,.25);padding:3px 6px;border-radius:7px}
.bigbtn .fill{position:absolute;left:0;bottom:0;height:3px;background:#fff3c0;opacity:.8}
.bigbtn.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,122,0)}50%{box-shadow:0 0 0 5px rgba(255,210,122,.75)}}
#heroBox{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;padding:7px 9px 7px 7px}
#heroBtn{width:52px;height:52px;border-radius:50%;padding:0;border:2px solid rgba(255,210,122,.4);background:none;cursor:pointer;position:relative;overflow:hidden}
#heroBtn.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,210,122,.45)}
#heroBtn.dead{filter:grayscale(1) brightness(.5)}
#heroBtn .lv{position:absolute;right:-2px;bottom:-2px;background:#e8b552;color:#3a2000;font:800 10px/1 system-ui;padding:3px 4px;border-radius:7px}
.hinfo{display:flex;flex-direction:column;gap:4px;min-width:96px}
.hinfo b{font-size:13px}.hinfo small{font-size:10px;color:var(--dim)}
.hp{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb84a,#ffe27a);transition:width .2s}
#abilityBtn{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(60,50,110,.6);cursor:pointer;padding:6px;position:relative;overflow:hidden}
#abilityBtn .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);pointer-events:none}
#abilityBtn.ready{box-shadow:0 0 0 2px rgba(255,210,122,.7),0 0 18px rgba(255,210,122,.4)}
#abilityBtn .k{position:absolute;top:2px;right:4px;font:700 9px/1 system-ui;opacity:.55}
.cornerbtn{width:44px;height:44px;border-radius:12px;padding:9px;box-sizing:border-box}
body:not(.playing) #speedBtn,body:not(.playing) #pauseBtn{display:none}
#speedBtn{width:auto;min-width:52px;padding:8px 10px;display:flex;gap:2px;align-items:center;font:800 13px/1 system-ui}
#speedBtn i{width:22px;height:18px;display:block}
/* ---------- world-anchored labels */
#labels{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.floater{position:absolute;left:0;top:0;font:800 14px/1 system-ui;color:#ffe27a;text-shadow:0 2px 6px #000,0 0 10px rgba(255,180,60,.5);pointer-events:none;white-space:nowrap}
.rift{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:50% 100%}
.rift .ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffd27a var(--p,100%),rgba(255,255,255,.15) 0);box-shadow:0 0 18px rgba(200,120,255,.6);animation:riftb 1.4s ease-in-out infinite}
.rift .ring>div{width:38px;height:38px;border-radius:50%;background:#1a1030;display:grid;place-items:center;font:800 11px/1 system-ui;color:#ffe7b0;text-align:center}
.rift .mini{display:flex;gap:2px;background:rgba(10,8,24,.8);border-radius:10px;padding:2px 4px;font:700 10px/1 system-ui}
.rift .mini span{display:flex;align-items:center;gap:1px}.rift .mini i{width:16px;height:16px;display:block}
@keyframes riftb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* ---------- radial menu + info card */
#radial{position:fixed;inset:0;z-index:25;pointer-events:none}
.rb{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid rgba(255,230,180,.45);background:radial-gradient(circle at 50% 35%,#3b3266,#1a1532);pointer-events:auto;cursor:pointer;padding:7px;box-sizing:border-box;transition:transform .12s,border-color .15s,box-shadow .15s;animation:rbIn .22s cubic-bezier(.2,1.4,.4,1) both}
.rb:hover{transform:scale(1.08)}
.rb.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,210,122,.55),0 0 20px rgba(255,210,122,.5);transform:scale(1.12)}
.rb.no{filter:grayscale(.7) brightness(.65)}
.rb .cost{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font:800 11px/1 system-ui;padding:2px 5px;border-radius:7px;background:#1a1532;border:1px solid rgba(255,230,180,.35);color:#ffe27a;white-space:nowrap}
.rb.no .cost{color:#ff8a9a}
.rb .lbl{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font:700 10px/1 system-ui;white-space:nowrap;text-shadow:0 1px 4px #000;color:#fff}
.rb.ok-confirm::after{content:'✓';position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:#6aff9a;color:#063;font:900 12px/18px system-ui;text-align:center}
@keyframes rbIn{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
#info{position:fixed;z-index:26;width:250px;padding:10px 12px;font:13px/1.4 system-ui;pointer-events:none;display:none}
#info.show{display:block}
#info h3{margin:0 0 2px;font-size:15px}
#info .sub{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
#info .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0;border-bottom:1px solid rgba(200,180,255,.08)}
#info .row b{font-variant-numeric:tabular-nums}
#info .up{color:var(--good)}
#info p{margin:6px 0 0;color:#ddd6f8;font-size:12.5px}
/* ---------- coach, banner, intro card */
#coach{position:fixed;z-index:27;left:50%;top:max(66px,calc(env(safe-area-inset-top) + 60px));transform:translateX(-50%);width:max-content;max-width:min(480px,calc(100vw - 24px));box-sizing:border-box;padding:10px 14px;display:none;gap:10px;align-items:center;font:14px/1.4 system-ui}
#coach.show{display:flex}
#coach .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#ffd27a,#ff7ad9);color:#201030;font-size:13px}
#coach button{margin-left:auto;flex:none;background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:12px}
#pointer{position:fixed;z-index:24;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--acc);pointer-events:none;display:none;animation:ptr 1.1s ease-in-out infinite;box-shadow:0 0 20px rgba(255,210,122,.6)}
@keyframes ptr{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.1);opacity:.5}}
#banner{position:fixed;z-index:22;left:0;right:0;top:26%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.4s ease-out}
#banner .e{font:700 12px/1 system-ui;letter-spacing:.45em;text-transform:uppercase;color:#ffd27a}
#banner h2{margin:6px 0 0;font:800 clamp(28px,6vw,48px)/1.1 system-ui;text-shadow:0 4px 24px rgba(0,0,0,.7);color:#fff}
@keyframes ban{0%{opacity:0;transform:translateY(14px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#intro{position:fixed;z-index:23;right:max(10px,env(safe-area-inset-right));top:max(62px,calc(env(safe-area-inset-top) + 58px));width:270px;padding:12px;display:none;gap:10px;font:13px/1.4 system-ui;animation:slide .4s cubic-bezier(.2,1,.3,1)}
#intro.show{display:flex}
#intro .ic{flex:none;width:58px;height:58px}
#intro h4{margin:0;font-size:15px}#intro .eb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#ffd27a}
#intro p{margin:4px 0 0;color:#ddd6f8}#intro .tip{color:#bfffd2;font-weight:600}
#intro button{margin-top:8px;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
/* ---------- map screen */
#mapScreen{position:fixed;inset:0;z-index:45;display:none;background:radial-gradient(ellipse at 50% 30%,rgba(30,20,60,.55),rgba(5,4,14,.92));backdrop-filter:blur(3px);overflow:auto}
#mapScreen.show{display:block}
#mapScreen .wrap{max-width:980px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
#mapScreen header{display:flex;align-items:center;gap:12px}
#mapScreen header h1{margin:0;font:800 clamp(22px,4vw,34px)/1 system-ui;background:linear-gradient(90deg,#ffd27a,#ff9ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
#mapScreen header .sp{flex:1}
#mapScreen .totals{font:700 14px/1 system-ui;color:#ffe27a;display:flex;align-items:center;gap:6px}#mapScreen .totals i{width:18px;height:18px;color:#ffd27a}
#valley{position:relative;width:100%;aspect-ratio:16/8;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(90deg,#1f3a34 0%,#2a3a5a 36%,#3a5a8a 44%,#5a6a9a 63%,#4a2a30 70%,#2a1414 100%)}
#valley svg.bgsvg{position:absolute;inset:0}
.node{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid rgba(255,230,180,.6);background:radial-gradient(circle at 50% 35%,#ffe7b0,#e8a040 60%,#7a4a10);cursor:pointer;display:grid;place-items:center;font:900 18px/1 system-ui;color:#3a2000;box-shadow:0 0 22px rgba(255,190,90,.55);transition:transform .15s}
.node:hover{transform:scale(1.1)}
.node.locked{background:radial-gradient(circle,#4a4660,#24203a);border-color:rgba(255,255,255,.2);color:#8a86a0;box-shadow:none;cursor:not-allowed}
.node.sel{box-shadow:0 0 0 4px #fff,0 0 30px rgba(255,220,140,.9)}
.node .stars{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .stars i{width:14px;height:14px;color:rgba(255,255,255,.25)}.node .stars i.on{color:#ffd27a}
.node.edgeL .nm{left:0!important;transform:none!important}.node.edgeR .nm{left:auto!important;right:0;transform:none!important}
.node .nm{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 11px/1 system-ui;color:#fff;text-shadow:0 1px 4px #000;background:rgba(10,8,24,.55);padding:3px 6px;border-radius:6px}
.biomeLab{position:absolute;top:10px;font:700 10px/1 system-ui;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6)}
#levelCard{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
#levelCard h2{margin:0;font-size:20px}#levelCard .bio{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#levelCard p{margin:4px 0 0;color:#ddd6f8;font-size:14px}
#levelCard .meta{font-size:12px;color:var(--dim);margin-top:4px}
#levelCard .acts{display:flex;flex-direction:column;gap:8px;min-width:170px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(40,36,80,.6);cursor:pointer;font:700 12px/1 system-ui}
.seg button.on{background:linear-gradient(135deg,#7a4cff,#d04dff);border-color:transparent}
.btn{font:700 14px/1 system-ui;padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(40,36,80,.65);cursor:pointer;min-height:44px}
.btn.primary{background:linear-gradient(135deg,#ff9a3a,#ff5ac0);border-color:transparent;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* ---------- modals */
.modal{position:fixed;inset:0;z-index:52;display:none;place-items:center;background:rgba(4,3,12,.6);backdrop-filter:blur(5px)}
.modal.open{display:grid}
.modal .card{width:min(440px,calc(100vw - 28px));padding:22px;text-align:center;box-sizing:border-box}
.modal h1{margin:0 0 4px;font:800 clamp(24px,5vw,34px)/1.1 system-ui}
.modal p{color:#ddd6f8;line-height:1.5;margin:8px 0}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars i{width:58px;height:58px;color:rgba(255,255,255,.14);transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.6,.4,1),color .2s}
.bigstars i.on{color:#ffd27a;transform:scale(1);filter:drop-shadow(0 0 12px rgba(255,210,122,.7))}
.statsrow{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--dim)}.statsrow b{display:block;font-size:18px;color:#fff}
.tipbox{background:rgba(120,255,170,.08);border:1px solid rgba(120,255,170,.25);border-radius:10px;padding:10px;color:#cfffe0;font-size:13.5px;text-align:left}
#menu .sd-card{max-width:min(520px,92vw)}
#menu .credits{font-size:11px;opacity:.5;margin-top:12px}
#menu .tagline{font-size:13px;color:#ffe2c8;margin:-8px 0 14px}
/* ---------- phones */
@media (max-width:520px){.biomeLab{display:none}}
@media (max-width:720px){
  .st{font-size:15px;padding:3px 7px 3px 4px}.st i{width:18px;height:18px}.st small{display:none}
  #stats{gap:1px;padding:3px}
  #waveBox{width:auto;left:auto;max-width:176px;padding:6px}
  #waveBox .chips{display:none}
  #waveBox .lab{font-size:9px}
  .bigbtn{font-size:13px;padding:10px 8px;min-height:44px}
  #heroBox{padding:5px}.hinfo{min-width:64px}.hinfo small{display:none}.hinfo b{font-size:11px}
  #heroBtn{width:46px;height:46px}#abilityBtn{width:46px;height:46px}
  #info{width:auto;left:10px!important;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 56px)!important;bottom:auto;padding:8px 10px;font-size:12px}
  #info .sub{margin-bottom:3px}#info p{margin-top:3px;font-size:12px}
  #info .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  .rb .lbl{display:none}.rb{width:52px;height:52px;margin:-26px 0 0 -26px}
  #intro{left:10px;right:10px;width:auto;top:auto;bottom:84px}
  #coach{font-size:13px;top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:10px;right:10px;transform:none;width:auto;max-width:none}
  #levelCard{grid-template-columns:1fr}
  #valley{aspect-ratio:auto;height:min(64vh,560px)}
  .node{width:44px;height:44px;margin:-22px 0 0 -22px;font-size:15px}.node .stars{top:46px}.node .nm{bottom:48px;font-size:10px}
}
</style>

<body>
<div id="boot"><div class="in">Lighting the lanterns<div class="bar"><i id="bootBar"></i></div></div></div>
<div id="labels"></div>
<div id="radial"></div>
<div id="info" class="panel"></div>
<div id="pointer"></div>
<div id="coach" class="panel"><div class="n" id="coachN">1</div><div id="coachT"></div><button id="coachSkip">Skip tips</button></div>
<div id="banner"><div class="e" id="banE"></div><h2 id="banT"></h2></div>

  <div id="stats" class="panel">
    <div class="st" id="stLives"><i id="icHeart"></i><b id="hLives">20</b></div>
    <div class="st" id="stGold"><i id="icCoin"></i><b id="hGold">0</b></div>

  </div>
</div>
<div id="mapScreen"><div class="wrap">
  <header><button class="btn" id="mapBack">‹ Title</button><h1>The Twilight Valley</h1><div class="sp"></div><div class="totals"><i id="icStarT"></i><span id="starTotal">0/24</span></div><button class="btn" id="mapSet" aria-label="Settings">⚙</button></header>
  <div id="valley"></div>
  <div id="levelCard" class="panel">
    <div><div class="bio" id="lcBio"></div><h2 id="lcName"></h2><p id="lcDesc"></p><div class="meta" id="lcMeta"></div></div>
    <div class="acts">
      <div class="seg" id="diffSeg"><button data-v="casual">Casual</button><button data-v="normal">Normal</button><button data-v="veteran">Veteran</button></div>
      <button class="btn primary" id="lcPlay">Defend</button>
      <button class="btn" id="lcEndless">Endless</button>
    </div>
  </div>
</div></div>
<div class="modal" id="pauseM"><div class="card panel"><h1>Paused</h1><p id="pauseInfo"></p>
  <div class="acts"><button class="btn primary" id="pResume">Resume</button><button class="btn" id="pRestart">Restart map</button><button class="btn" id="pSettings">Settings</button><button class="btn" id="pQuit">Valley map</button></div>
  <p style="font-size:12px;opacity:.6;margin-top:14px">Keys: 1–5 build · U upgrade · S sell · T targeting · H hero · Q Dawnburst · Space call wave · F speed · Esc pause</p></div></div>
<div class="modal" id="endM"><div class="card panel"><div class="e" id="endE" style="font:700 11px/1 system-ui;letter-spacing:.35em;text-transform:uppercase;color:#ffd27a"></div><h1 id="endT"></h1>
  <div class="bigstars" id="endStars"></div><div class="statsrow" id="endStats"></div><div class="tipbox hidden" id="endTip"></div>
  <div class="acts" id="endActs"></div></div></div>
