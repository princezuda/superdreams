<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checkers: Event Horizon — Superdreams</title>
<meta name="description" content="Classic checkers, then the board fights back: black holes, graves, meteor showers and portals. Four themes, four AI levels, local two-player.">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.webgpu.js","three/webgpu":"/vendor/three/build/three.webgpu.js","three/tsl":"/vendor/three/build/three.tsl.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #05040a; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #cfd6ff; font: 600 14px/1.4 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; z-index: 1; }
  #boot i { display: block; width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid rgba(180,140,255,.2); border-top-color: #ffb36b; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* HUD */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; transition: opacity .35s; }
  .hud.hidden, .hidden { opacity: 0; pointer-events: none !important; }
  .hud-top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 66px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card { pointer-events: auto; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 9px 13px; border-radius: 14px; background: rgba(10,12,28,.62); border: 1px solid rgba(170,185,255,.14); backdrop-filter: blur(8px); min-width: 128px; transition: border-color .3s, box-shadow .3s, transform .3s; }
  .card.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 24px -4px var(--c); transform: translateY(1px); }
  .card .chip { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 45%), var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 0 12px -2px var(--c); }
  .card b { font-size: 14px; letter-spacing: .02em; }
  .card small { opacity: .65; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .card .counts { grid-column: 1 / -1; display: flex; gap: 10px; font-size: 12px; opacity: .9; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .counts span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; vertical-align: 0; }
  .card .counts .k::before { border-radius: 2px; transform: rotate(45deg); background: #ffd27a; }
  .card .counts .x::before { background: transparent; border: 1px solid currentColor; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .pill { display: flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; background: rgba(10,12,28,.7); border: 1px solid rgba(170,185,255,.16); backdrop-filter: blur(8px); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .pill .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 10px var(--c, #fff); }
  .pill.think .txt::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .hazard { max-width: min(520px, 90vw); text-align: center; font-size: 13px; line-height: 1.35; padding: 6px 12px; border-radius: 10px; background: rgba(30,10,40,.55); border: 1px solid rgba(255,170,110,.25); color: #ffe2c8; }
  .hazard:empty { display: none; }
  .hazard.warn { animation: hz 1s ease-in-out infinite alternate; border-color: rgba(255,120,80,.6); }
  @keyframes hz { to { background: rgba(80,20,30,.65); } }
  .hud-bottom { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; }
  .hud-bottom .sd-btn { pointer-events: auto; min-width: 92px; background: rgba(14,18,40,.68); backdrop-filter: blur(8px); }
  .hud-bottom .sd-btn:disabled { opacity: .4; cursor: default; transform: none; }
  .kbd { position: absolute; left: 14px; bottom: max(18px, env(safe-area-inset-bottom)); font-size: 11px; opacity: .45; letter-spacing: .04em; }
  @media (max-width: 640px) {
    .hud-top { right: 60px; gap: 6px; }
    .card { min-width: 0; padding: 7px 9px; grid-template-columns: auto; }
    .card .chip { grid-row: auto; width: 18px; height: 18px; }
    .card small { display: none; }
    .card b { font-size: 12px; }
    .pill { font-size: 13px; padding: 7px 11px; }
    .kbd { display: none; }
    .hazard { font-size: 12px; }
    .hud-bottom .sd-btn { min-width: 0; padding: 11px 14px; }
  }

  /* menu additions (kit menu is #menu) */
  #menu .sd-card { max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: thin; max-width: min(640px, 94vw); }
  #menu .sd-card h1 { line-height: 1.05; }
  #menu .sd-label { margin-top: 10px; }
  #menu .sd-row { margin: 6px 0; }
  #menu .sd-btn { padding: 10px 14px; font-size: 14px; }
  .mode-desc { min-height: 2.6em; font-size: 13px; line-height: 1.4; opacity: .85; margin: 2px auto 0; max-width: 470px; color: #ffe2c8; }
  .menu-foot { font-size: 11px; opacity: .45; margin-top: 12px; letter-spacing: .04em; }

  /* end screen */
  #end { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, rgba(10,8,30,.35), rgba(2,2,8,.82)); backdrop-filter: blur(3px); transition: opacity .5s; }
  #end .sd-card { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.85) translateY(10px); opacity: 0; } }
  #end h1 { font-size: clamp(34px, 8vw, 56px); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 16px; }
  .stats div { padding: 10px 6px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
  .stats b { display: block; font-size: 22px; letter-spacing: 0; margin-bottom: 2px; color: #ffe2c8; }
</style>
</head>
<body>
<div id="boot"><div><i></i>Opening the event horizon…</div></div>

<div class="hud hidden" id="hud">
  <div class="hud-top">
    <div class="card" id="card-r"><span class="chip"></span><b class="nm">Crimson</b><small class="who">You</small><div class="counts"><span class="m">12</span><span class="k">0</span><span class="x" title="captured">0</span></div></div>
    <div class="center">
      <div class="pill" id="turn"><span class="dot"></span><span class="txt">Your move</span></div>
      <div class="hazard" id="hazard"></div>
    </div>
    <div class="card" id="card-b"><span class="chip"></span><b class="nm">Ebony</b><small class="who">AI · Medium</small><div class="counts"><span class="m">12</span><span class="k">0</span><span class="x" title="captured">0</span></div></div>
  </div>
  <div class="hud-bottom">
    <button class="sd-btn" id="btn-undo" title="Undo (U)">↶ Undo</button>
    <button class="sd-btn" id="btn-hint" title="Hint (H)">✦ Hint</button>
    <button class="sd-btn" id="btn-menu" title="Menu (Esc)">☰ Menu</button>
  </div>
  <div class="kbd">Click / tap a piece, then a glowing square · drag to orbit · arrows + Enter to play by keyboard</div>
</div>

<div id="end" class="hidden">
  <div class="sd-card">
    <h1 id="end-title">Victory</h1>
    <p id="end-reason"></p>
    <div class="stats" id="end-stats"></div>
    <div class="sd-row"><button class="sd-btn primary" id="btn-rematch">Rematch</button><button class="sd-btn" id="btn-end-menu">Main menu</button></div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
