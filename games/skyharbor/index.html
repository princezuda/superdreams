<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyharbor</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.webgpu.js","three/webgpu":"/vendor/three/build/three.webgpu.js","three/tsl":"/vendor/three/build/three.tsl.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>
:root{--acc:#ffaa33;--glass:rgba(12,16,34,.74);--line:rgba(170,190,255,.18);--txt:#eef2ff;--dim:#a8b2d8;--good:#6aff9a;--bad:#ff6a6a}
html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:var(--txt);-webkit-user-select:none;user-select:none}
button{font-family:inherit}
.hud{position:fixed;z-index:20;pointer-events:none}
.hud>*{pointer-events:auto}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
#topbar{top:10px;left:10px;right:70px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
#planetChip{padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:120px}
#planetChip b{font-size:15px;letter-spacing:.02em}
#planetChip span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
#stats{display:flex;gap:2px;padding:4px;flex-wrap:wrap}
.stat{padding:5px 10px;border-radius:11px;display:flex;flex-direction:column;min-width:64px;cursor:default}
.stat small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.warn b{color:#ffb46a}.stat.bad b{color:var(--bad)}
.stat.flash{animation:statflash .6s ease-out}
@keyframes statflash{0%{background:rgba(255,210,122,.35)}100%{background:transparent}}
#clock{display:flex;align-items:center;gap:4px;padding:4px 6px}
#clock .t{font-variant-numeric:tabular-nums;font-weight:700;padding:0 6px;min-width:84px;text-align:center;font-size:13px}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:rgba(40,50,100,.45);color:var(--txt);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,transform .1s,border-color .15s}
.ib:hover{background:rgba(70,80,150,.7);transform:translateY(-1px)}
.ib.on{background:linear-gradient(135deg,#6a5cff,#c04dff);border-color:transparent}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#navbtns{position:fixed;top:10px;right:62px;z-index:30;display:flex;gap:6px}
#toolbar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tool{position:relative;min-width:58px;height:58px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;letter-spacing:.04em;padding:0 4px;transition:background .15s,transform .1s}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:rgba(120,140,255,.16)}
.tool.on{background:linear-gradient(135deg,rgba(106,92,255,.9),rgba(192,77,255,.9))}
.tool .k{position:absolute;top:3px;right:5px;font-size:9px;opacity:.45}
.tool .c{font-size:9px;opacity:.7}
.tool.sep{min-width:1px;width:1px;padding:0;background:var(--line);margin:8px 2px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,122,.0)}50%{box-shadow:0 0 0 4px rgba(255,210,122,.75)}}
#side{right:10px;top:76px;width:330px;max-height:calc(100vh - 170px);overflow:auto;padding:14px 16px;display:none}
#side.open{display:block}
#side h2{margin:0 0 4px;font-size:18px}
#side h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
#side p{margin:4px 0;line-height:1.45;font-size:13px;color:#d8def8}
#side .x{position:absolute;top:8px;right:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid rgba(160,180,255,.07)}
.row b{font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6a5cff,#ff7ad9)}
.stars{color:#ffd27a;letter-spacing:1px;font-size:14px}
.btn{font:600 14px/1 inherit;font-family:inherit;padding:11px 14px;border-radius:12px;border:1px solid rgba(170,190,255,.25);background:rgba(40,50,100,.55);color:var(--txt);cursor:pointer;min-height:42px}
.btn:hover{background:rgba(70,80,150,.7)}
.btn.primary{background:linear-gradient(135deg,#6a5cff,#c04dff);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 8px;border-radius:20px;background:rgba(120,140,255,.14);margin:2px 3px 2px 0}
.chip.boost{background:rgba(106,255,154,.16);color:#bfffd2}.chip.nerf{background:rgba(255,106,106,.16);color:#ffc8c8}
.vt{display:grid;grid-template-columns:92px 1fr 24px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.vt .bar{margin:0}
.review{font-size:12.5px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);margin:6px 0;line-height:1.4}
.review small{display:block;color:var(--dim);margin-top:3px}
#coach{position:fixed;z-index:25;left:50%;top:84px;transform:translateX(-50%);max-width:min(520px,calc(100vw - 24px));padding:12px 16px 12px 14px;display:none;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
#coach.show{display:flex}
#coach .step{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#ffd27a,#ff7ad9);color:#1a1030;font-size:13px}
#coach .skip{margin-left:auto;flex:none;background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;text-decoration:underline}
#labels{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:600;padding:4px 9px;border-radius:9px;background:rgba(10,14,30,.72);border:1px solid var(--line);transition:opacity .3s}
.lab.sys{font-weight:600;background:rgba(10,14,30,.55)}
.lab.sys small{display:block;font-size:10px;color:var(--dim);font-weight:500}
.lab.src{border-color:rgba(255,210,122,.4)}
.float{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:14px;color:#9dffb8;text-shadow:0 2px 6px rgba(0,0,0,.7);animation:floatup 1.6s ease-out forwards}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:230px;white-space:normal;font-size:12px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.92);color:#1a1d2e;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:bub .4s ease-out}
.bubble:after{content:"";position:absolute;left:50%;bottom:-6px;border:6px solid transparent;border-top-color:rgba(255,255,255,.92);border-bottom:0;transform:translateX(-50%)}
.bubble .stars{color:#e8a400;font-size:12px}
@keyframes bub{from{opacity:0;transform:translate(-50%,-80%) scale(.9)}to{opacity:1}}
#wonder{position:fixed;inset:0;z-index:35;display:none;align-items:flex-end;justify-content:center;pointer-events:none;padding-bottom:16vh}
#wonder.show{display:flex}
#wonder .card{text-align:center;max-width:min(620px,92vw);animation:wonderIn 1.2s cubic-bezier(.2,.8,.2,1)}
#wonder .eyebrow{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#ffd27a;margin-bottom:8px}
#wonder h1{margin:0;font-size:clamp(30px,6vw,56px);font-weight:800;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.6);background:linear-gradient(90deg,#ffe6b0,#ffffff 50%,#c8d8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#wonder p{margin:10px auto 0;max-width:520px;font-size:15px;line-height:1.5;color:#e8ecff;text-shadow:0 2px 12px rgba(0,0,0,.8)}
@keyframes wonderIn{from{opacity:0;transform:translateY(24px);letter-spacing:.2em}to{opacity:1;transform:none}}
#wonder:before,#wonder:after{content:"";position:fixed;left:0;right:0;height:11vh;background:#000;transition:transform .8s}
#wonder:before{top:0}#wonder:after{bottom:0}
#sysCard{left:10px;top:76px;width:330px;padding:14px 16px;display:none;max-height:calc(100vh - 170px);overflow:auto}
#sysCard.open{display:block}
#sysCard h2{margin:0;font-size:20px}
#hint{left:50%;bottom:86px;transform:translateX(-50%);font-size:13px;color:var(--dim);padding:6px 12px;text-align:center;max-width:90vw;display:none}
#hint.show{display:block}
#loading{position:fixed;inset:0;z-index:45;display:none;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(20,24,60,.85),#03040a);transition:opacity .4s}
#loading.show{display:grid}
#loading .in{text-align:center;width:min(380px,80vw)}
#loading .bar{height:6px;margin-top:14px}
#gallery{position:fixed;inset:0;z-index:28;display:none;pointer-events:none}
#gallery.show{display:block}
#gallery .gcard{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;padding:16px 18px;pointer-events:auto}
@media (max-width:720px){#gallery .gcard{top:auto;bottom:76px;transform:none;max-height:38vh}}
#gallery .gnav{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;pointer-events:auto}
#gallery .gtitle{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#ffd27a;pointer-events:none}
body.gclean #gallery .gcard,body.gclean #gallery .gnav,body.gclean #gallery .gtitle,body.gclean .sd-corner{display:none}
#eyebar{left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:6px;padding:6px}
#eyebar.show{display:flex}
.modal{position:fixed;inset:0;z-index:52;display:none;place-items:center;background:rgba(2,3,10,.6);backdrop-filter:blur(4px)}
.modal.open{display:grid}
.modal .sd-card{max-height:86vh;overflow:auto;text-align:left}
.modal .sd-card h1{text-align:center}
.mile{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(160,180,255,.08);font-size:14px}
.mile .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;border:1px solid var(--line)}
.mile.done .dot{background:linear-gradient(135deg,#6aff9a,#3ac8ff);color:#06101a;border:none;font-weight:900}
.mile small{display:block;color:var(--dim);font-size:12px}
.lmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lmc{padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;font-size:12px;text-align:left;color:var(--txt)}
.lmc:hover{background:rgba(120,140,255,.15)}
.lmc b{display:block;font-size:13px;margin-bottom:2px}
.lmc.locked{opacity:.45;cursor:not-allowed}
.lmc .p{color:#ffd27a;font-weight:700}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:12px;margin:6px 0}
.flow .n{padding:8px;border-radius:10px;background:rgba(255,255,255,.05);text-align:center}
.flow .n b{display:block;font-size:16px}
.flow .a{color:var(--dim);font-size:18px}
.lb{display:flex;justify-content:space-between;font-size:13px;padding:4px 6px;border-radius:7px}
.lb.you{background:rgba(255,210,122,.14);color:#ffe0a0;font-weight:700}
#menu .sd-card{max-height:94vh;overflow:auto}
@media (max-width:720px){
  #topbar{right:8px;left:8px;top:58px;gap:5px}
  #planetChip{display:none}
  #stats{width:100%;justify-content:space-between;padding:3px;box-sizing:border-box}
  .stat{min-width:0;padding:3px 6px}.stat b{font-size:13px}.stat small{font-size:8.5px;letter-spacing:.06em}
  #navbtns{right:62px}
  #clock{padding:3px 5px}#clock .ib{width:34px;height:34px;border-radius:9px}#clock .ib svg{width:16px;height:16px}
  #clock .t{min-width:60px;font-size:12px}
  #side,#sysCard{left:8px;right:8px;width:auto;top:auto;bottom:84px;max-height:44vh;border-radius:16px;box-sizing:border-box}
  #coach{top:150px;bottom:auto;left:8px;right:8px;transform:none;max-width:none;font-size:12.5px;padding:9px 12px;gap:9px}
  #coach .step{width:24px;height:24px;font-size:12px}
  body:has(#side.open) #coach,body:has(#sysCard.open) #coach{display:none}
  #hint{display:none!important}
  .tool{min-width:50px;height:52px}.tool .c{display:none}
  #gallery .gcard{top:auto;bottom:76px;transform:none;max-height:38vh}
}
</style>
</head>
<body>
<div id="labels"></div>
<div id="loading"><div class="in"><div style="font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#ffd27a" id="loadT">Charting the cluster</div><div class="bar"><i id="loadBar" style="width:5%"></i></div></div></div>
<script type="module" src="./game.js"></script>
</body>
</html>
