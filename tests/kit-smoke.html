<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kit smoke</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.webgpu.js","three/webgpu":"/vendor/three/build/three.webgpu.js","three/tsl":"/vendor/three/build/three.tsl.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head><body style="margin:0;background:#000">
<script type="module">
import { THREE, createRenderer, createPipeline, autoResize, probe, startLoop, stageLights, spaceBackground, dust, initUI, startMenu, settingsButton, updateTweens, toast } from '/shared/sd-kit.js';
initUI();
const renderer = await createRenderer();
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 200); cam.position.set(0, 4, 9); cam.lookAt(0, 0, 0);
spaceBackground(scene); stageLights(scene);
const board = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 8), new THREE.MeshStandardNodeMaterial({ color: 0x334466, roughness: 0.4, metalness: 0.2 }));
board.position.y = -0.2; board.receiveShadow = true; scene.add(board);
const k = new THREE.Mesh(new THREE.TorusKnotGeometry(0.8, 0.25, 120, 20), new THREE.MeshStandardNodeMaterial({ color: 0xff9944, emissive: 0x552200, roughness: 0.35 }));
k.position.y = 1.3; k.castShadow = true; scene.add(k);
const glow = new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 16), new THREE.MeshBasicNodeMaterial({ color: new THREE.Color(4, 2, 8) }));
glow.position.set(2.5, 1, 1); scene.add(glow);
const d = dust(scene);
const post = createPipeline(renderer, scene, cam);
autoResize(renderer, cam);
const P = probe(renderer, { dataReady: true });
settingsButton();
startMenu({ title: 'Kit Smoke', subtitle: 'menu test', options: [{ key: 'theme', label: 'Theme', value: 'a', choices: [{ v: 'a', label: 'A' }, { v: 'b', label: 'B' }] }], onStart: (v) => toast('start ' + v.theme) });
if (new URLSearchParams(location.search).has('nomenu')) document.getElementById('menu').classList.add('hide');
startLoop(renderer, (dt, t) => { k.rotation.y = t * 0.5; d.update(t); updateTweens(dt); }, post.render);
</script></body></html>
